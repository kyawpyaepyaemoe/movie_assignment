<!DOCTYPE html>
<html>
<head>
    <title>Edit Movie</title>
</head>
<body>

    <h1>Edit Movie</h1>

    {% if error %}
        <p style="color: red;">{{ error }}</p>
    {% endif %}

    <form method="post">
        {% csrf_token %}
        <input type="text" name="title" value="{{ movie.title }}">
        <input type="text" name="genre" value="{{ movie.genre }}">
        <input type="number" name="release_year" value="{{ movie.release_year }}">
        <input type="number" name="personal_rating" value="{{ movie.personal_rating }}" min="1" max="5">
        <button type="submit">Save</button>
    </form>

    <a href="{% url 'home' %}">Back to list</a>

</body>
</html>
